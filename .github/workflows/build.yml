name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          ./build.sh

      - name: Package
        run: |
          ditto -c -k --keepParent build/G-Cap.app G-Cap.zip
          lipo -info build/G-Cap.app/Contents/MacOS/GCap

      - uses: actions/upload-artifact@v4
        with:
          name: G-Cap
          path: G-Cap.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" G-Cap.zip \
            --title "G-Cap $GITHUB_REF_NAME" \
            --notes "Unsigned build. After unzipping, run:

          \`\`\`
          xattr -dr com.apple.quarantine /path/to/G-Cap.app
          \`\`\`

          Or open it once, then go to System Settings › Privacy & Security and click
          **Open Anyway**."
